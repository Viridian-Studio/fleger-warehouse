server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Document uploads are capped at 25 MB by the API; leave room for the
    # multipart envelope so nginx never rejects a file the API would accept.
    client_max_body_size 32m;

    # The frontend calls the API on a relative path, so this host proxies it.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads and text recognition can take a while on large files.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Angular owns the routing: every unknown path serves the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
